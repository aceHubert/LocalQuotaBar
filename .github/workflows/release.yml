name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "目标 tag，如 v0.2.0；要求该 tag 已推送到远端"
        required: true
        type: string

permissions:
  contents: write

# 同一 tag 的 tag 推送与手动触发只保留最后一次，避免并发创建同名 Release。
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    env:
      # tag 属于手动输入，经 env 传入脚本避免直接注入 run 步骤
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # tag 推送事件检出事件 tag；手动触发检出指定版本 tag，资产取自该版本提交
          ref: ${{ env.TAG }}

      - name: Build app
        run: make app

      - name: Inject version, sign and package
        run: |
          VERSION="${TAG#v}"
          APP=".build/release/LocalQuotaBar.app"
          plutil -replace CFBundleShortVersionString -string "$VERSION" "$APP/Contents/Info.plist"
          plutil -replace CFBundleVersion -string "$GITHUB_RUN_NUMBER" "$APP/Contents/Info.plist"
          codesign --force --sign - "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "LocalQuotaBar-$VERSION.zip"

      - name: Create release and upload artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: LocalQuotaBar-*.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
